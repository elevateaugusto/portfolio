<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Augusto Castro (gutao) - Portfólio</title>

<!-- Fontes do Google Fonts: JetBrains Mono pros títulos, IBM Plex Sans pro texto -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ===========================================================
     VARIÁVEIS DE COR — paleta "Neon Noturno", exatamente como escolhida.
     Tudo declarado aqui pra ficar fácil de achar e trocar depois.
  ============================================================ */
  :root{
    --bg: #0D0F1A;
    --texto: #E6E8F2;
    --primaria: #00E5FF;
    --secundaria: #7C3AED;
    --destaque: #FF2E88;

    --fonte-titulo: 'JetBrains Mono', monospace;
    --fonte-texto: 'IBM Plex Sans', sans-serif;

    --duracao-anim: 0.6s; /* dentro da faixa 0.3s–0.8s pedida */
  }

  /* Reduz movimento pra quem pediu isso no sistema */
  @media (prefers-reduced-motion: reduce){
    :root{ --duracao-anim: 0s; }
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--texto);
    font-family: var(--fonte-texto);
    line-height: 1.6;
    overflow-x: hidden;
  }

  h1, h2, h3, .fonte-titulo{
    font-family: var(--fonte-titulo);
    margin: 0;
    letter-spacing: -0.01em;
  }

  a{ color: var(--primaria); }

  img{ max-width: 100%; display: block; }

  section{ padding: 5rem 1.5rem; }

  .container{
    max-width: 960px;
    margin: 0 auto;
  }

  /* ===========================================================
     HERO — topo centralizado com efeito de "luz" que segue o
     mouse/toque, feito com um gradiente radial posicionado via JS.
  ============================================================ */
  .hero{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    padding: 3rem 1.5rem;
    isolation: isolate; /* mantém a luz atrás do conteúdo */
  }

  .hero__luz{
    position: absolute;
    inset: 0;
    z-index: -1;
    background: radial-gradient(
      circle 320px at var(--luz-x, 50%) var(--luz-y, 30%),
      rgba(0, 229, 255, 0.16),
      transparent 70%
    );
    transition: background var(--duracao-anim) ease-out;
  }

  .avatar{
    width: 140px;
    height: 140px;
    border-radius: 50%; /* formato círculo, como escolhido */
    background: linear-gradient(160deg, var(--secundaria), var(--primaria));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--fonte-titulo);
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--bg);
    margin-bottom: 1.5rem;
    border: 3px solid var(--texto);
  }

  .hero h1{
    font-size: clamp(2.2rem, 8vw, 4rem);
    font-weight: 800;
  }

  .hero .apelido{
    display: block;
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: var(--primaria);
    font-weight: 500;
    margin-top: 0.4rem;
  }

  .hero .frase{
    max-width: 40ch;
    margin-top: 1.5rem;
    font-size: 1.15rem;
    color: var(--texto);
  }

  .badge-torcida{
    margin-top: 1.5rem;
    font-family: var(--fonte-titulo);
    font-size: 0.85rem;
    padding: 0.4rem 0.9rem;
    border: 1px solid var(--secundaria);
    color: var(--secundaria);
  }

  /* Easter egg do pinguim: escondido até clicar no nome */
  .pinguim-easter-egg{
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    font-family: var(--fonte-titulo);
    font-size: 0.85rem;
    color: var(--primaria);
    opacity: 0;
    transform: scale(0.6) translateY(10px);
    height: 0;
    overflow: hidden;
    transition: opacity var(--duracao-anim) ease, transform var(--duracao-anim) ease;
  }
  .pinguim-easter-egg.visivel{
    opacity: 1;
    transform: scale(1) translateY(0);
    height: auto;
    overflow: visible;
  }

  /* ===========================================================
     TÍTULOS DE SEÇÃO — sem rótulo/eyebrow extra, direto ao ponto
  ============================================================ */
  .titulo-secao{
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    margin-bottom: 2rem;
  }

  /* ===========================================================
     SOBRE MIM
  ============================================================ */
  .sobre p{
    max-width: 65ch;
    font-size: 1.05rem;
  }
  .sobre p + p{ margin-top: 1.2rem; }

  /* ===========================================================
     MUNDO SENAI 2026 — Nova seção integrada ao tema Neon Noturno
  ============================================================ */
  .mundo-senai__card{
    background: rgba(230, 232, 242, 0.04);
    border: 1px solid rgba(0, 229, 255, 0.25);
    border-radius: 12px;
    padding: 2rem;
    display: grid;
    grid-template-columns: 1fr;
    gap: 2rem;
  }

  @media (min-width: 768px){
    .mundo-senai__card{
      grid-template-columns: 1fr 1fr;
      align-items: center;
    }
  }

  .mundo-senai__midia{
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(230, 232, 242, 0.15);
    background: #1a1d2b;
  }

  .mundo-senai__midia img{
    width: 100%;
    height: auto;
    object-fit: cover;
  }

  .mundo-senai__legenda{
    font-size: 0.95rem;
    color: rgba(230, 232, 242, 0.85);
    margin-bottom: 1.5rem;
  }

  .mundo-senai__acoes{
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
  }

  /* Dialog / Modal customizado com o CSS Neon Noturno */
  .dialog-senai{
    background: #141726;
    color: var(--texto);
    border: 2px solid var(--primaria);
    border-radius: 10px;
    padding: 2rem;
    max-width: 500px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .dialog-senai::backdrop{
    background: rgba(13, 15, 26, 0.85);
    backdrop-filter: blur(4px);
  }

  .dialog-senai h3{
    color: var(--primaria);
    margin-bottom: 1rem;
    font-size: 1.3rem;
  }

  .dialog-senai p{
    font-size: 0.98rem;
    margin-bottom: 1.5rem;
    line-height: 1.5;
  }

  .btn-dialog-fechar{
    background: var(--destaque);
    color: var(--bg);
    border: none;
    font-family: var(--fonte-titulo);
    font-weight: 700;
    padding: 0.6rem 1.2rem;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--secundaria);
    transition: transform 0.2s ease;
  }

  .btn-dialog-fechar:hover{
    transform: translate(-2px, -2px);
  }

  /* ===========================================================
     ENTREGAS — os cards ficam "dentro" de um computador desenhado
     em CSS. É um carrossel: só um trabalho aparece por vez na
     tela, e as setas trocam o slide com animação.
  ============================================================ */
  .computador{
    max-width: 640px;
    margin: 0 auto;
  }

  /* Moldura do monitor */
  .computador__monitor{
    background: #1a1d2b;
    border: 2px solid rgba(230, 232, 242, 0.15);
    border-radius: 14px;
    padding: 1rem;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  }

  /* "Câmera" do monitor, só um
